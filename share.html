<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared with NexMusic</title>
<meta name="description" content="A song, playlist or artist shared from NexMusic.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07070f">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<style>
  :root { --bg:#07070f; --card:#12131f; --line:rgba(255,255,255,.09); --text:#f4f6fb; --dim:#9aa1b5; --accent:#22c55e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 600px at 20% -10%, rgba(34,197,94,.12), transparent 60%), var(--bg);
    color:var(--text);
    font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding:24px;
  }
  .card {
    width:100%; max-width:440px; background:var(--card);
    border:1px solid var(--line); border-radius:24px; padding:28px;
    box-shadow:0 30px 80px rgba(0,0,0,.5); text-align:center;
  }
  .logo { width:56px; height:56px; border-radius:16px; margin:0 auto 14px; display:block; }
  .kind { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .title { font-size:20px; font-weight:700; margin:10px 0 4px; word-break:break-word; }
  .by { color:var(--dim); font-size:14px; margin-bottom:18px; word-break:break-word; }
  .cover { width:100%; border-radius:16px; display:block; margin-bottom:20px; aspect-ratio:1/1; object-fit:cover; background:rgba(255,255,255,.05); }
  .btns { display:flex; flex-direction:column; gap:10px; }
  .btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:14px 18px; border-radius:14px; font-weight:700; font-size:15px;
    text-decoration:none; transition:transform .15s ease, filter .15s ease;
  }
  .btn:active { transform:scale(.98); }
  .primary { background:var(--accent); color:#04120a; }
  .primary:hover { filter:brightness(1.08); }
  .ghost { border:1px solid var(--line); color:var(--text); }
  .ghost:hover { background:rgba(255,255,255,.05); }
  .foot { margin-top:18px; font-size:12.5px; color:var(--dim); }
  .foot a { color:var(--accent); text-decoration:none; }
  .spin { width:22px; height:22px; border:2px solid rgba(255,255,255,.15); border-top-color:var(--accent); border-radius:50%; margin:0 auto; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/logo-512.png" alt="NexMusic">
    <div class="kind" id="kind">SHARED LINK</div>
    <div class="title" id="title"><div class="spin" style="margin-top:10px"></div></div>
    <div class="by" id="by"></div>
    <img class="cover" id="cover" alt="" style="display:none">
    <div class="btns">
      <a class="btn primary" id="app" href="#" style="display:none">♪ Open in the NexMusic app</a>
      <a class="btn ghost" id="listen" href="#" style="display:none">▶ Listen on YouTube Music</a>
      <a class="btn ghost" id="open" href="#" style="display:none">Open on YouTube</a>
    </div>
    <p class="foot" id="noapp" style="display:none">App didn't open? <a href="/" style="color:var(--accent)">Get NexMusic</a> — it plays these links directly, on Windows and Android.</p>
    <p class="foot">Shared from <strong>NexMusic</strong> · <a href="/">nexmusic.app</a><br>Recipients with the NexMusic app open this link straight in the app.</p>
  </main>

<script>
(function () {
  var path = location.pathname.toLowerCase();
  var q = new URLSearchParams(location.search);
  var kindEl = document.getElementById('kind');
  var titleEl = document.getElementById('title');
  var byEl = document.getElementById('by');
  var coverEl = document.getElementById('cover');
  var listen = document.getElementById('listen');
  var open = document.getElementById('open');
  var appBtn = document.getElementById('app');
  var noapp = document.getElementById('noapp');
  var isAndroid = /android/i.test(navigator.userAgent);

  // nexmusic:// opens the Windows app (protocol registered by the desktop app)
  // and the Android app (intent:// with package fallback when it isn't installed).
  function setAppLink(kind, id, webFallback) {
    var schemeLink = 'nexmusic://' + kind;
    if (kind === 'watch') schemeLink += '?v=' + encodeURIComponent(id);
    else if (kind === 'playlist') schemeLink += '?list=' + encodeURIComponent(id);
    else schemeLink += '/' + encodeURIComponent(id);
    if (isAndroid) {
      appBtn.href = 'intent://' + schemeLink.slice('nexmusic://'.length) +
        '#Intent;scheme=nexmusic;package=com.nexapp.nexmusic;S.browser_fallback_url=' +
        encodeURIComponent(webFallback || location.href) + ';end';
    } else {
      appBtn.href = schemeLink;
    }
    appBtn.style.display = 'flex';
    appBtn.addEventListener('click', function () {
      setTimeout(function () {
        if (document.visibilityState === 'visible') noapp.style.display = 'block';
      }, 2500);
    });
  }

  function setCard(kind, title, by, cover) {
    kindEl.textContent = kind;
    titleEl.textContent = title;
    byEl.textContent = by || '';
    if (cover) { coverEl.src = cover; coverEl.style.display = 'block'; }
  }

  var id = q.get('v') || '';
  var list = q.get('list') || '';
  var channel = '';
  var m = path.match(/\/channel\/([A-Za-z0-9_\-]+)/);
  if (m) channel = m[1];

  // Works via the /watch, /playlist, /channel rewrites and also directly as share.html?v=….
  if (id && (path.endsWith('/watch') || (!list && !channel))) {
    setCard('SONG', 'Loading…', '', '');
    var yt = 'https://www.youtube.com/watch?v=' + encodeURIComponent(id);
    var ytm = 'https://music.youtube.com/watch?v=' + encodeURIComponent(id);
    setAppLink('watch', id, ytm);
    listen.href = ytm; listen.style.display = 'flex';
    open.href = yt; open.style.display = 'flex';
    // Try to enrich with the title / channel / thumbnail (best effort).
    try {
      fetch('https://noembed.com/embed?url=' + encodeURIComponent(yt), { signal: AbortSignal.timeout ? AbortSignal.timeout(4000) : undefined })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(0); })
        .then(function (j) {
          if (j && j.title) setCard('SONG', j.title, j.author_name || '', j.thumbnail_url || '');
        })
        .catch(function () { setCard('SONG', 'A shared song', 'Tap below to start listening', ''); });
    } catch (e) { setCard('SONG', 'A shared song', '', ''); }
  } else if (path.endsWith('/playlist') && list) {
    setCard('PLAYLIST', 'Shared playlist', 'Opens in the NexMusic app');
    setAppLink('playlist', list, 'https://music.youtube.com/playlist?list=' + encodeURIComponent(list));
    listen.href = 'https://music.youtube.com/playlist?list=' + encodeURIComponent(list);
    listen.style.display = 'flex';
  } else if (channel) {
    setCard('ARTIST', 'Shared artist', 'Opens in the NexMusic app');
    setAppLink('channel', channel, 'https://music.youtube.com/channel/' + encodeURIComponent(channel));
    listen.href = 'https://music.youtube.com/channel/' + encodeURIComponent(channel);
    listen.textContent = '♪ View on YouTube Music';
    listen.style.display = 'flex';
  } else {
    setCard('NEXMUSIC', 'This link looks incomplete', 'Ask the sender to share the song again');
    document.querySelector('.btns').style.display = 'none';
  }
})();
</script>
</body>
</html>
